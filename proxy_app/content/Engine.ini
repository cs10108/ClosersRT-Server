;=============================================================================
; Closers RT offline -- Engine.ini override
;
; The client fetches its patch manifest over HTTPS via UE4's libcurl:
;
;     LogHttp: Warning: invalid HTTP response code received.
;       URL: https://download.closersrt.com/Patch_Live/service-live.txt,
;       HTTP code: 0
;     CM: Download_ServiceInfo_Start -> Download_ServiceInfo_Fail
;
; That host is gone (NXDOMAIN), so the local proxy has to answer it, which means
; terminating TLS with a certificate we minted ourselves.  UE4 refuses a
; self-signed peer by default, and `UNetworkSettings::bVerifyPeer` is the switch
; that turns that check off -- it is a `UPROPERTY(config)` on
; UNetworkSettings, so it is read from this file.
;
; This file is NOT part of the APK: it lives in the game's own save directory,
; which adb can write without root:
;
;   /sdcard/Android/data/com.naddicgames.projectm/files/
;       UE4Game/CM/CM/Saved/Config/Android/Engine.ini
;
; The [Core.System] block below is the game's original content, preserved
; verbatim so nothing else changes.
;=============================================================================

[Core.System]
Paths=../../../Engine/Content
Paths=%GAMEDIR%Content
Paths=../../../Engine/Plugins/Experimental/GPULightmass/Content
Paths=../../../CM/Plugins/CMPlugin/Content
Paths=../../../CM/Plugins/GAMEPOT_UE4/Content
Paths=../../../CM/Plugins/SpinePlugin/Content
Paths=../../../CM/Plugins/StorageCoreSDKPlugin/Content
Paths=../../../CM/Plugins/XIGNCODE3SDKPlugin/Content
Paths=../../../CM/Plugins/YuriTool/Content
Paths=../../../Engine/Plugins/2D/Paper2D/Content
Paths=../../../Engine/Plugins/Developer/AnimationSharing/Content
Paths=../../../Engine/Plugins/Editor/GeometryMode/Content
Paths=../../../Engine/Plugins/Editor/SpeedTreeImporter/Content
Paths=../../../Engine/Plugins/Enterprise/DatasmithContent/Content
Paths=../../../Engine/Plugins/Experimental/MotoSynth/Content
Paths=../../../Engine/Plugins/Media/MediaCompositing/Content
Paths=../../../Engine/Plugins/Experimental/GeometryProcessing/Content
Paths=../../../Engine/Plugins/Runtime/Synthesis/Content
Paths=../../../Engine/Plugins/Runtime/AudioSynesthesia/Content

;-----------------------------------------------------------------------------
; Accept our self-signed patch certificate.
;
; UE4's config keys are the UPROPERTY names, so `bVerifyPeer` is the one that
; matters; `n.VerifyPeer` is written as well because some UE4 revisions read
; that spelling (it is the legacy UE3-era name) and an unknown key is simply
; ignored.
;-----------------------------------------------------------------------------
[/Script/Engine.NetworkSettings]
bVerifyPeer=False
n.VerifyPeer=False

;-----------------------------------------------------------------------------
; Keep the HTTP client quiet about the certificate and do not let it fall back
; to a bundled CA store we cannot add to.
;-----------------------------------------------------------------------------
[/Script/Engine.Engine]
bSmoothFrameRate=True
